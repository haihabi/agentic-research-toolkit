[project]
name = "overleaf-mcp"
version = "0.1.0"
description = "MCP server exposing Overleaf projects as file operations over the git bridge"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
overleaf-mcp = "overleaf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overleaf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
